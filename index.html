<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIKNAK ZONE - Official Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0d11; color: #fff; padding-bottom: 50px; }

        /* Navbar */
        nav {
            background: #16161e; padding: 12px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 2px solid #ff5e00; position: sticky; top: 0; z-index: 100;
        }
        .logo { 
            font-size: 12px; font-weight: bold; color: #fff; background: #ff5e00;
            padding: 6px 10px; border-radius: 6px; cursor: pointer; border: none;
        }
        .nav-links { display: flex; gap: 4px; }
        .nav-btn {
            background: #232330; color: #ccc; border: 1px solid #3b3b4f;
            padding: 6px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
        }
        .nav-btn.active { background: #ff5e00; color: #fff; }
        .coin-badge { border: 1px solid #ff5e00; color: #00ff66; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }

        /* Layout */
        .container { max-width: 500px; margin: 15px auto; padding: 0 12px; }
        .page { display: none; }
        .page.active { display: block; }

        /* Card System */
        .card { background: #16161e; border: 1px solid #2d2d3d; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        input, textarea {
            width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ff5e00;
            background: #0d0d11; color: #fff; border-radius: 6px; font-size: 13px; outline: none;
        }
        .btn-action {
            width: 100%; padding: 10px; background: #ff5e00; color: #fff;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { background: #1c1c28; border: 1px solid #3b3b4f; border-radius: 10px; padding: 10px; text-align: center; position: relative; }
        .item-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; background: #0d0d11; }
        .item-title { font-size: 12px; font-weight: bold; margin: 5px 0; color: #fff; }
        .item-price { color: #00ff66; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        .btn-buy { width: 100%; background: #ff5e00; color: #fff; border: none; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-delete-item {
            position: absolute; top: 5px; right: 5px; background: #ff0055; color: #fff; border: none;
            padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; display: none;
        }

        /* Banner แอดมิน */
        .admin-banner { background: #00ff66; color: #000; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 15px; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-card { background: #16161e; border: 2px solid #ff5e00; border-radius: 12px; padding: 15px; width: 90%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <button class="logo" onclick="clickAdminLogo()">⚙️ ADMIN</button>
        <div class="nav-links">
            <button class="nav-btn active" id="btn-shop" onclick="showPage('shop')">🛒 ร้านค้า</button>
            <button class="nav-btn" id="btn-topup" onclick="showPage('topup')">💳 เติมเงิน</button>
            <button class="nav-btn" id="btn-wheel" onclick="showPage('wheel')">🎡 วงล้อ</button>
            <button class="nav-btn" id="btn-admin-nav" style="display:none; background:#00ff66; color:#000;" onclick="showPage('admin')">⚙️ หลังบ้าน</button>
        </div>
        <div class="coin-badge">💎 <span id="coin-txt">0</span> COIN</div>
    </nav>

    <div class="container">

        <!-- หน้าที่ 1: ร้านค้า -->
        <div id="page-shop" class="page active">
            <h3 style="color:#ff5e00; text-align:center; margin-bottom:12px;">🔥 KRIKNAK ZONE - หน้าร้านค้า 🔥</h3>
            <div class="shop-grid" id="shop-container">
                <!-- รายการสินค้าจะถูกสร้างที่นี่อัตโนมัติ -->
            </div>
        </div>

        <!-- หน้าที่ 2: เติมเงิน -->
        <div id="page-topup" class="page">
            <div class="card">
                <h3 style="color:#ff5e00;">🟧 เติมเงิน TrueMoney Wallet</h3>
                <input type="text" id="wallet-link" placeholder="วางลิงก์ซองอั่งเปา">
                <button class="btn-action" onclick="topupWallet()">เติมเงินซองอั่งเปา</button>
            </div>
            <div class="card">
                <h3>🎟️ ใช้คูปองส่วนลด</h3>
                <input type="text" id="coupon-code" placeholder="กรอกโค้ด เช่น KRIKNAK08">
                <button class="btn-action" onclick="useCoupon()">ใช้คูปอง</button>
            </div>
        </div>

        <!-- หน้าที่ 3: วงล้อ -->
        <div id="page-wheel" class="page">
            <div class="card" style="text-align:center;">
                <h3>🎡 วงล้อสุ่มไอดี (20 COIN)</h3>
                <button class="btn-action" style="margin-top:20px;" onclick="spinWheel()">[ กดเพื่อหมุนวงล้อ ]</button>
            </div>
        </div>

        <!-- หน้าที่ 4: หลังบ้านแอดมิน -->
        <div id="page-admin" class="page">
            <div class="admin-banner">👑 ยินดีต้อนรับครับ แอดมิน</div>
            
            <div class="card">
                <h3 style="color:#00ff66; margin-bottom:10px;">➕ เพิ่มสินค้า / ไอดีใหม่ลงร้านค้า</h3>
                <input type="text" id="add-title" placeholder="ชื่อสินค้า">
                <input type="number" id="add-price" placeholder="ราคา (COIN)">
                <input type="text" id="add-img" placeholder="ลิงก์รูปภาพ (ไม่ใส่ก็ได้)">
                <input type="text" id="add-acc" placeholder="ID: xxx | PASS: yyy">
                <button class="btn-action" style="background:#00ff66; color:#000;" onclick="addNewItem()">🛍️ บันทึกเพิ่มลงร้านค้าถาวร</button>
            </div>

            <div class="card">
                <h3 style="color:#ff0055; margin-bottom:10px;">🎟️ เพิ่มโค้ดคูปอง</h3>
                <input type="text" id="add-code" placeholder="ชื่อโค้ด เช่น FREE999">
                <input type="number" id="add-amount" placeholder="จำนวน COIN">
                <button class="btn-action" style="background:#ff0055;" onclick="addNewCoupon()">+ สร้างโค้ดคูปอง</button>
            </div>

            <button class="btn-action" style="background:#333;" onclick="logoutAdmin()">🚪 ออกจากระบบแอดมิน</button>
        </div>

    </div>

    <!-- POP-UP เข้าสู่ระบบแอดมิน -->
    <div class="modal" id="modal-login">
        <div class="modal-card">
            <h3 style="color:#ff0055; margin-bottom:10px;">🔐 เข้าสู่ระบบแอดมิน</h3>
            <input type="password" id="admin-pass" placeholder="กรอกรหัสผ่าน (PHZ-500-32)">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-action" style="background:#333;" onclick="closeModal('modal-login')">ยกเลิก</button>
                <button class="btn-action" onclick="loginAdmin()">เข้าสู่ระบบทันที</button>
            </div>
        </div>
    </div>

    <script>
        const defaultPlaceholderImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='150'><rect width='200' height='150' fill='%23222'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ff5e00' font-size='16'>KRIKNAK ZONE</text></svg>";

        // สินค้าเริ่มต้น
        const initialProducts = [
            { id: 1, title: 'กล่องสุ่มไอดีกล้ามทอง', price: 39, img: defaultPlaceholderImg, acc: 'ID: KRIK-GOLD-01 | PASS: gold39pass' },
            { id: 2, title: 'รหัสหมวกเอฟ', price: 50, img: defaultPlaceholderImg, acc: 'ID: KRIK-HAT-02 | PASS: hatff50' },
            { id: 3, title: 'รหัสกล้ามไฟลาวา', price: 89, img: defaultPlaceholderImg, acc: 'ID: KRIK-LAVA-03 | PASS: lava89ff' },
            { id: 4, title: 'รหัสท่าปักธง + รวมปืน', price: 150, img: defaultPlaceholderImg, acc: 'ID: KRIK-FLAG-04 | PASS: flag150pro' },
            { id: 5, title: 'รหัสกล้ามทอง หญิง', price: 60, img: defaultPlaceholderImg, acc: 'ID: KRIK-GFEM-05 | PASS: girlgold60' }
        ];

        // โหลดข้อมูลจาก localStorage
        let myCoins = parseInt(localStorage.getItem("user_coins")) || 0;
        let coupons = JSON.parse(localStorage.getItem("coupons")) || { "KRIKNAK08": 50, "KRIKNAK-ZONE": 100 };
        let isAdmin = localStorage.getItem("is_admin") === "true";
        let productsList = JSON.parse(localStorage.getItem("products_db")) || initialProducts;

        // แสดงผลเริ่มต้น
        document.getElementById("coin-txt").innerText = myCoins;
        renderProducts();

        if (isAdmin) {
            document.getElementById("btn-admin-nav").style.display = "inline-block";
        }

        // ระบบสลับหน้า
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + pageId).classList.add('active');
            
            let activeBtn = document.getElementById('btn-' + pageId);
            if (activeBtn) activeBtn.classList.add('active');
        }

        // โลโก้แอดมิน
        function clickAdminLogo() {
            if (isAdmin) {
                showPage('admin');
            } else {
                document.getElementById('admin-pass').value = '';
                document.getElementById('modal-login').style.display = 'flex';
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // เข้าสู่ระบบแอดมินแบบเด้งทันที
        function loginAdmin() {
            let pass = document.getElementById("admin-pass").value.trim();
            if (pass === "PHZ-500-32") {
                isAdmin = true;
                localStorage.setItem("is_admin", "true");
                document.getElementById("btn-admin-nav").style.display = "inline-block";
                closeModal('modal-login');
                renderProducts(); // แสดงปุ่มลบสินค้าเฉพาะแอดมิน
                showPage('admin'); // เด้งเข้าหน้าหลังบ้านทันที
                alert("👑 ยินดีต้อนรับครับ แอดมิน!");
            } else {
                alert("❌ รหัสผ่านไม่ถูกต้อง!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem("is_admin", "false");
            document.getElementById("btn-admin-nav").style.display = "none";
            renderProducts();
            showPage('shop');
            alert("🚪 ออกจากระบบแอดมินเรียบร้อย");
        }

        // ระบบวาดรายการสินค้า (เซฟแล้วอยู่ยาว)
        function renderProducts() {
            const container = document.getElementById("shop-container");
            container.innerHTML = "";

            productsList.forEach((item, index) => {
                let div = document.createElement("div");
                div.className = "item-card";
                
                let deleteBtnHtml = isAdmin ? `<button class="btn-delete-item" style="display:block;" onclick="deleteItem(${index})">🗑️ ลบ</button>` : '';

                div.innerHTML = `
                    ${deleteBtnHtml}
                    <img src="${item.img}" onerror="this.src='${defaultPlaceholderImg}'">
                    <div class="item-title">${item.title}</div>
                    <div class="item-price">${item.price} COIN</div>
                    <button class="btn-buy" onclick="buyItem('${item.title}', ${item.price}, '${item.acc}')">ดูรายละเอียด / สั่งซื้อ</button>
                `;
                container.appendChild(div);
            });
        }

        // เพิ่มสินค้าใหม่ลงในระบบถาวร
        function addNewItem() {
            let title = document.getElementById("add-title").value.trim();
            let price = parseInt(document.getElementById("add-price").value);
            let img = document.getElementById("add-img").value.trim();
            let acc = document.getElementById("add-acc").value.trim();

            if (!title || isNaN(price) || price <= 0 || !acc) {
                alert("❌ กรุณากรอกชื่อสินค้า ราคา และข้อมูลรหัสให้ครบถ้วน!");
                return;
            }

            if (!img) {
                img = defaultPlaceholderImg;
            }

            let newItem = { id: Date.now(), title: title, price: price, img: img, acc: acc };
            productsList.push(newItem);

            // บันทึกลง localStorage ถาวร
            localStorage.setItem("products_db", JSON.stringify(productsList));

            renderProducts();
            alert("✅ บันทึกและเพิ่มสินค้าลงร้านค้าสำเร็จ! (สินค้านี้จะไม่หายแม้รีเฟรช)");

            document.getElementById("add-title").value = "";
            document.getElementById("add-price").value = "";
            document.getElementById("add-img").value = "";
            document.getElementById("add-acc").value = "";
            showPage('shop');
        }

        // ลบสินค้า
        function deleteItem(index) {
            if (confirm("⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบสินค้านี้?")) {
                productsList.splice(index, 1);
                localStorage.setItem("products_db", JSON.stringify(productsList));
                renderProducts();
            }
        }

        // ระบบซื้อสินค้า
        function buyItem(name, price, acc) {
            if (myCoins < price) {
                alert("❌ COIN ไม่พอ! ไปหน้าเติมเงินก่อนครับ");
                return;
            }
            myCoins -= price;
            localStorage.setItem("user_coins", myCoins);
            document.getElementById("coin-txt").innerText = myCoins;
            alert("🎉 สั่งซื้อสำเร็จ!\nคุณได้รับ: " + name + "\n\nรหัสของคุณคือ:\n" + acc);
        }

        // ระบบเติมเงิน & คูปอง
        function topupWallet() {
            let link = document.getElementById("wallet-link").value.trim();
            if (!link.includes("gift.truemoney.com")) {
                alert("❌ ลิงก์ไม่ถูกต้อง!");
                return;
            }
            let add = Math.floor(Math.random() * 100) + 50;
            myCoins += add;
            localStorage.setItem("user_coins", myCoins);
            document.getElementById("coin-txt").innerText = myCoins;
            alert("🎉 เติมเงินสำเร็จ! ได้รับ +" + add + " COIN");
            document.getElementById("wallet-link").value = "";
        }

        function useCoupon() {
            let code = document.getElementById("coupon-code").value.trim().toUpperCase();
            if (coupons[code]) {
                let add = coupons[code];
                myCoins += add;
                delete coupons[code];
                localStorage.setItem("user_coins", myCoins);
                localStorage.setItem("coupons", JSON.stringify(coupons));
                document.getElementById("coin-txt").innerText = myCoins;
                alert("✅ ใช้คูปองสำเร็จ! ได้รับ +" + add + " COIN");
                document.getElementById("coupon-code").value = "";
            } else {
                alert("❌ โค้ดไม่ถูกต้อง หรือถูกใช้งานไปแล้ว");
            }
        }

        function addNewCoupon() {
            let code = document.getElementById("add-code").value.trim().toUpperCase();
            let amount = parseInt(document.getElementById("add-amount").value);
            if (!code || isNaN(amount) || amount <= 0) {
                alert("❌ กรุณากรอกชื่อโค้ดและจำนวน COIN ให้ถูกต้อง!");
                return;
            }
            coupons[code] = amount;
            localStorage.setItem("coupons", JSON.stringify(coupons));
            alert("✅ สร้างโค้ดคูปอง: " + code + " (+ " + amount + " COIN) ถาวรเรียบร้อย!");
            document.getElementById("add-code").value = "";
            document.getElementById("add-amount").value = "";
        }

        function spinWheel() {
            if (myCoins < 20) {
                alert("❌ COIN ไม่พอ!");
                return;
            }
            myCoins -= 20;
            localStorage.setItem("user_coins", myCoins);
            document.getElementById("coin-txt").innerText = myCoins;
            alert("🎉 ยินดีด้วย! คุณได้รับไอดีสุ่ม:\nID: KRIK-LUCKY-999 | PASS: win8888");
        }
    </script>
</body>
  </html>
